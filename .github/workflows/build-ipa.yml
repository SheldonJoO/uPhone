name: Build üPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || echo "no Xcode 26"
          xcodebuild -version

      - name: Build unsigned app
        run: |
          cd iOS
          set -o pipefail
          xcodebuild -project AirSIM.xcodeproj \
            -scheme AirSIM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log
          echo "=== BUILD DONE ==="

      - name: Package IPA
        run: |
          APP_DIR="iOS/build/Build/Products/Release-iphoneos"
          echo "=== Contents of $APP_DIR ==="
          ls -la "$APP_DIR"
          APP_NAME=$(ls "$APP_DIR" | grep "\.app$" | head -1)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          echo "Found app: $APP_NAME"
          echo "=== App contents ==="
          ls -la "$APP_DIR/$APP_NAME" | head -20
          mkdir -p "$APP_DIR/Payload"
          cp -r "$APP_DIR/$APP_NAME" "$APP_DIR/Payload/"
          cd "$APP_DIR"
          zip -qry uPhone-unsigned.ipa Payload
          echo "=== IPA created ==="
          ls -lh uPhone-unsigned.ipa
          unzip -l uPhone-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: uPhone-unsigned-ipa
          path: iOS/build/Build/Products/Release-iphoneos/uPhone-unsigned.ipa
          if-no-files-found: error
