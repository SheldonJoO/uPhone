name: Build üPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications/ | grep -i xcode

      - name: Select latest Xcode
        run: |
          # Try Xcode 26, then 16, fallback to default
          for v in 26 26.0 16.4 16; do
            for app in /Applications/Xcode_$v.app /Applications/Xcode-$v.app; do
              if [ -d "$app" ]; then
                echo "Found $app"
                sudo xcode-select -s "$app/Contents/Developer"
                xcodebuild -version
                exit 0
              fi
            done
          done
          echo "Using default Xcode"
          xcodebuild -version

      - name: Build unsigned app
        run: |
          cd iOS
          set -o pipefail
          xcodebuild -project AirSIM.xcodeproj \
            -scheme AirSIM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AIRSIM_PUSH_RELAY_URL=https://airsim-push.dntmove.asia \
            build 2>&1 | tee xcodebuild.log

      - name: Package IPA
        if: success()
        run: |
          APP_DIR="iOS/build/Build/Products/Release-iphoneos"
          ls -la "$APP_DIR"
          APP_NAME=$(ls "$APP_DIR" | grep "\.app$" | head -1)
          mkdir -p "$APP_DIR/Payload"
          cp -r "$APP_DIR/$APP_NAME" "$APP_DIR/Payload/"
          cd "$APP_DIR"
          zip -qry uPhone-unsigned.ipa Payload
          ls -lh uPhone-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uPhone-unsigned-ipa
          path: iOS/build/Build/Products/Release-iphoneos/uPhone-unsigned.ipa
          if-no-files-found: error
