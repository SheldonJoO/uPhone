# ⚠️ 部署配置（已校验真实值）
#
# 实际脚本名是 "uphone-push-relay"（不是 airsim-push）。
# 路由 airsim-push.dntmove.asia/* 已绑定到该脚本。
# 本配置可直接 `wrangler deploy`（需先 `wrangler login` / 已有 oauth token）。
#
# secret 不要写进本文件，用命令设置（部署时会通过 keep_bindings 保留线上已有 secret）：
#   wrangler secret put DASHBOARD_TOKEN
#   （APNS_* 当前为空，不需要设置）
#
# 注意：本 Worker 当前通过 Cloudflare REST API 直接部署（保留全部绑定与 secret）。
# 若改用 wrangler deploy，首次会因 DO 迁移要求报迁移 tag 错误——按提示调整 [[migrations]] 的 tag 即可。

name = "uphone-push-relay"
main = "src/index.mjs"
compatibility_date = "2026-08-20"
workers_dev = false

[[routes]]
pattern = "airsim-push.dntmove.asia/*"
zone_id = "61edb172f1928afe0512cb9c1075576c"

# KV：设备注册表（复用线上已存在的 namespace id）
[[kv_namespaces]]
binding = "DEVICES"
id = "31dc7899746045408ebd6436591848bf"

# Durable Objects
[[durable_objects.bindings]]
name = "COMMANDS"
class_name = "DeviceCommandSession"

[[durable_objects.bindings]]
name = "STATUS"
class_name = "AgentStatusRegistry"

[[durable_objects.bindings]]
name = "MEDIA"
class_name = "CallMediaSession"

# DO 类迁移（线上已存在这些类；若 wrangler 报 migration 冲突，调整下方 tag）
[[migrations]]
tag = "v1"
new_classes = ["DeviceCommandSession", "AgentStatusRegistry", "CallMediaSession"]

[vars]
ALLOWED_BUNDLE_ID = "com.sheldonjoo.ukit"
WEBRTC_ROLLOUT_PERCENT = "0"
WEBRTC_TRANSPORT_READY = "false"
